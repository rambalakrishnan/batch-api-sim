[package]
name = "batch-api-sim"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fastrand = { version = "2.5.0", features = ["js"] }
hmac = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
wasm-bindgen = "0.2.130"
worker = "0.9"

[dev-dependencies]
rusqlite = { version = "0.43.0", features = ["bundled"] }
